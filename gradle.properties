kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
org.gradle.caching = true

# Ported from ../typewriter-plugin/gradle.properties -- read by build.gradle.kts's version
# assignment and publishing{} channel derivation, and by the release workflows (draft release
# tag, publishPlugin). SemVer, may carry a pre-release label (e.g. 1.1.0-beta.1).
pluginVersion = 1.0.0

# Read by build.gradle.kts's changelog{} block to build release-comparison links. This project's
# content is intended to replace typewriter-plugin's main branch, so it points at that
# already-marketplace-linked repository rather than a new one.
pluginRepositoryUrl = https://github.com/asm0dey/typewriter-plugin
